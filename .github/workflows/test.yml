name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Tests (PGlite)
        run: deno task test

      # Same suite through the deno-postgres pool the functions use, with real
      # concurrent connections - PGlite is single-connection.
      - name: Tests (Postgres 17)
        run: deno task test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
